<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Badge -->
  <rect x="80" y="75" width="460" height="42" rx="21" fill="#fef3c7" />
  <circle cx="104" cy="96" r="8" fill="#d97706" />
  <text x="122" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#78350f">
    PM Surya Ghar: Muft Bijli Yojana 2026
  </text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Solar Calculator <tspan fill="url(#gold)">India</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#a7f3d0">
    Estimate Rooftop Capacity, Government Subsidy (up to ₹78,000),
  </text>
  <text x="80" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#a7f3d0">
    Monthly Electricity Bill Savings &amp; 5-Year Loan Repayment.
  </text>

  <!-- Feature Cards Container -->
  <g transform="translate(80, 375)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="240" height="120" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">GOVT. SUBSIDY</text>
    <text x="24" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#fcd34d">Up to ₹78k</text>

    <!-- Card 2 -->
    <rect x="265" y="0" width="240" height="120" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="289" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">PAYBACK PERIOD</text>
    <text x="289" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">&lt; 3.0 Yrs</text>

    <!-- Card 3 -->
    <rect x="530" y="0" width="240" height="120" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="554" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">SBI GREEN LOAN</text>
    <text x="554" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">7.0% p.a.</text>

    <!-- Card 4 -->
    <rect x="795" y="0" width="240" height="120" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="819" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">STATE COVERAGE</text>
    <text x="819" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">21+ States</text>
  </g>

  <!-- Bottom Brand Footer -->
  <text x="80" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399">
    solarcalculatorindia.com
  </text>
  <text x="1120" y="565" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    100% Free • Independent • Privacy-First
  </text>
</svg>
